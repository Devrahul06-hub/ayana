<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Left leg of A (dark navy), diagonal from top-center to bottom-left -->
  <line x1="100" y1="22" x2="18" y2="185" stroke="#0D2B4E" stroke-width="28" stroke-linecap="round"/>
  <!-- Right leg of A (cyan), diagonal from top-center to bottom-right -->
  <line x1="100" y1="22" x2="182" y2="185" stroke="#00C7E6" stroke-width="28" stroke-linecap="round"/>
  <!-- Crossbar (dark navy), covers over the cyan so it appears in front -->
  <line x1="48" y1="122" x2="130" y2="122" stroke="#0D2B4E" stroke-width="22" stroke-linecap="round"/>
</svg>
